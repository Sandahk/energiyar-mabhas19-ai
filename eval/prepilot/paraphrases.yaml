  - {id: B11, family: B, query: "ضریب انتقال حرارت کلی دیوار بیرونی چقدر مجاز است؟", expect: {r_note: true}}
  - {id: B12, family: B, query: "دیوار خارجی من چه ضریب انتقال حرارتی باید داشته باشه؟", expect: {r_note: true}}
  - {id: B13, family: B, query: "حد مجاز ضریب انتقال حرارت (U) سقف مجاور فضای نیمه باز کنترل نشده در اقلیم 3A", expect: {r_note: true, element: "سقف مجاور فضای نیمه باز کنترل نشده", climate: 3A}}
  - {id: B14, family: B, query: "ضریب انتقال حرارت مجاز کف مجاور هوای آزاد چقدر است؟", expect: {r_note: true}}
