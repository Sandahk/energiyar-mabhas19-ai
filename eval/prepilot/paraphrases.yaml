# Pre-pilot paraphrase sanity set (development only).
#
# NOT a benchmark, holdout, Final-N set or promotion evidence. Written and frozen before the
# pre-pilot routing patch (2026-11-13) so that the patch is checked against varied wording, not
# against one sentence. Not tuned after seeing results; ~80% is a sanity indicator only.
#
# Families:
#   A  energy-consumption limit  -> Appendix 3 max EUI (structured value, or a clarification for a
#      missing occupancy / area band / rating / climate). Never prose, never a refusal.
#   B  U-value / R of an opaque element -> table 19-5-1 min R (structured value, or a clarification
#      for element / climate). Never a 19-5-2 (transparent) value, never U = 1/R.
#   C  controls: existing behaviour that must not change.
#
# expect keys (all optional):
#   occupancy: Appendix 3 row number; climate; rating   -> the answered row, when fully specified
#   element: printed 19-5-1 element; climate             -> the answered row, when fully specified
#   r_note: true -> the answer must say the requirement is a minimum R (U-wording questions)
#   table: expected table for controls
version: 1
frozen: 2026-11-13
cases:
  # ---------------- Family A: energy-consumption limit ----------------
  - {id: A01, family: A, query: "برای یک ساختمان مسکونی در اقلیم 3B، حد مجاز مصرف انرژی چقدر است؟"}
  - {id: A02, family: A, query: "حداکثر مصرف انرژی ساختمان مسکونی در اقلیم 3B چقدر است؟"}
