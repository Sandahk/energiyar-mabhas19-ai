# Normalizer shadow experiment 1: case selection and gold (annotated 2026-11-13, before any
# model call; no model output has been seen). Questions come verbatim from authored1.yaml.
#
# Selection (deterministic engine = release 7952912 + the clarification UX patch, hybrid):
# - failure: the engine fails closed (prose / refusal / out of scope) although the source
#   prints a row the person means. Gold = the printed rows (accept set), the printed output,
#   and the city / climate / number the question states (climate taken from a city only when
#   the exact city lookup gives one printed class). Omitting a stated constraint is allowed
#   (the engine would ask); stating a different one is wrong.
# - abstain_expected: the engine fails closed and the source prints NO row or quantity that
#   means what is asked; any valid proposal is a wrong suggestion.
# - control: the first 14 (by ID) of the questions the engine already handles correctly; the
#   trigger must not fire and their answers must be unchanged.
# - excluded: listed with the reason; never sent to the model.
