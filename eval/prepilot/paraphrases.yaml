  - {id: B16, family: B, query: "حداکثر ضریب انتقال حرارت مجاز دیوار غیرنورگذر در اقلیم 1B", expect: {r_note: true}}
  - {id: B17, family: B, query: "ضریب انتقال حرارت دیوار خارجی مجاور فضای نیمه باز کنترل نشده در اقلیم 0B چقدر باید باشه؟", expect: {r_note: true, element: "دیوار خارجی مجاور فضای نیمه باز کنترل نشده", climate: 0B}}
  - {id: B18, family: B, query: "مقدار U برای سقف مجاور فضای آزاد طبق جدول ۱۹-۵-۱", expect: {r_note: true}}
  - {id: B19, family: B, query: "ضریب انتقال حرارت درهای غیرنورگذر بدون لولا در اقلیم 4B", expect: {r_note: true, element: "درهای غیرنورگذر بدون لولا", climate: 4B}}
  - {id: B20, family: B, query: "ضریب انتقال حرارت مجاز کف ساختمان روی خاک", expect: {r_note: true}}
  - {id: B21, family: B, query: "حداقل مقاومت حرارتی دیوار خارجی چقدر است؟"}
