  - {id: A05, family: A, query: "حداکثر مصرف مجاز انرژی برای هتل در اقلیم 5B رده B چند کیلووات ساعت بر متر مربع است؟", expect: {occupancy: 20, climate: 5B, rating: B}}
  - {id: A06, family: A, query: "مصرف انرژی یک دبستان در اقلیم 1B حداکثر چقدر می‌تونه باشه؟"}
  - {id: A07, family: A, query: "سقف مجاز مصرف انرژی ویلا تو اقلیم 4A چنده؟"}
  - {id: A08, family: A, query: "حد مجاز مصرف انرژی ساختمان مسکونی زیر ۳۰۰۰ متر مربع در اقلیم 3A برای رده A", expect: {occupancy: 2, climate: 3A, rating: A}}
  - {id: A09, family: A, query: "بیشترین مصرف انرژی مجاز برای رستوران در اقلیم 2B چقدر است؟"}
  - {id: A10, family: A, query: "حداکثر شدت مصرف انرژی مجاز ساختمان اداری خصوصی در اقلیم 3B"}
