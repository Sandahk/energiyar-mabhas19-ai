  - {id: A22, family: A, query: "سقف مصرف انرژی سالانه برای مهد کودک در اقلیم 3A چقدر تعیین شده؟"}
  - {id: A23, family: A, query: "حداکثر مصرف انرژی مجاز ساختمان اداری عمومی اقلیم 2B رده B بر حسب کیلووات ساعت بر متر مربع", expect: {occupancy: 4, climate: 2B, rating: B}}
  - {id: A24, family: A, query: "مصرف انرژی ساختمان مسکونی من در اقلیم 4A حداکثر چقدر می‌تواند باشد تا رده B بگیرد؟"}
