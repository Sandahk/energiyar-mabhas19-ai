# Offline retrieval evaluation set (evidence only; no expected answers).
#
# Evidence semantics (scored by mabhas19.retrieval.eval):
#   blocks            prose hit = a returned chunk containing ANY of these curated block IDs
#   sections          alternative prose evidence: a returned chunk whose section number is listed
#   records           structured: ALL of these record IDs must be returned
#   acceptable_records structured: may also be returned without counting as noise
#   tables            structured, table level: hits must come from these tables (non-empty)
#   source_issues     must be exposed (hit issue refs, conflict IDs or notes)
#   conflict          a Conflict carrying this issue ID must be returned
#   no_records        structured lookup must return no record (value absent in the source)
# Evidence IDs were taken from the curated files (curated/text, curated/tables), never from a
# retrieval run. Frozen sources: main corpus 4922e37, main tables f9d7d1d, App.2 c45c637,
# App.3 07949a6, App.7 6f08c65.
