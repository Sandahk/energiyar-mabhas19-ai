version: 1
status: proposed_for_review
generated_by: python -m mabhas19.cli.robustness_audit collisions --write-baseline
definition: 'word keys = options.label_key of each name word (>= 3 letters, stopwords of api/invariants.STOPWORDS
  dropped) of: the 77 listed cities, Appendix 7 material names, printed row labels of every main table
  (19-3-2 excluded: it prints the listed cities themselves), Appendix 3 occupancies, printed output names,
  family words. exact = one key in more than one namespace group; prefix = a key of >= 4 letters that
  is a strict prefix of a key of another namespace group.'
review_classes:
  guarded: a known misreading risk with a runtime guard and a test
  watch: distinct things share a name word; covered by the generated sweeps
  same_concept: the same name printed by several tables
  family_word: a reviewed family word
  generic_word: not a distinguishing name
  pending: new; not reviewed (the collisions test fails until reviewed)
