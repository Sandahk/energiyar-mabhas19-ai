  - id: SI-0003
    status: unresolved
    title: "Appendix 3 rows 1-2: comparison operator direction visually ambiguous"
    locations:
      - {doc_id: m19-ed5-1404-app03, pdf_pages: [2, 3, 4, 5]}
    description: >-
      Use types 1 and 2 read «مسکونی [operator] ۳۰۰۰ مترمربع». The two operators render as
      «≥» and «>» with the same orientation, so right-to-left mirroring makes the intended
      split (e.g. ≤3000 vs >3000 m2) impossible to confirm from the glyphs alone.
    do_not: ["infer the operator direction", "present either row as the larger/smaller building without verification"]
    raised_on: 2026-10-04
    raised_by: "Phase 2A reference transcription (Claude)"

