  - {id: A17, family: A, query: "سقف مصرف انرژی ساختمان مسکونی چقدره؟"}
  - {id: A18, family: A, query: "حد مجاز مصرف انرژی ساختمان‌های مسکونی طبق مبحث ۱۹ چیه؟"}
  - {id: A19, family: A, query: "یک آپارتمان مسکونی ۲۰۰۰ متری در اقلیم 3B داریم، حداکثر مصرف انرژی مجازش برای رده C چقدر است؟", expect: {occupancy: 2, climate: 3B, rating: C}}
  - {id: A20, family: A, query: "حداکثر انرژی مصرفی مجاز برای مسجد در اقلیم 1B"}
