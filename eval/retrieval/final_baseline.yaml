# Post-hoc evaluator findings from the adjudication. They do NOT replace any number above; the
# immutable original result stands as recorded. Adjudication package (git-ignored):
# data/retrieval/adjudication/final_adjudication.yaml.
post_hoc_evaluator_findings:
  structured_scoring:
    official_structured_exact_match: 0.839
    post_hoc_record_level_structured_exact_match: 0.602
    cause: >-
      every record-evidence case in final.yaml also lists `tables`, and the original evaluator
      scored such cases at table level only; a typed no-match for an expected table also passed,
      so cases that expected concrete records passed with wrong rows or with no rows at all
    replaces_original_result: false
  unsupported_scoring:
    cause: >-
      the original unsupported precision/recall used strict expected_route labels and did not
      honor acceptable_routes (e.g. F128: expected unsupported, prose explicitly acceptable,
      counted as a false negative)
    replaces_original_result: false
